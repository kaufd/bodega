# ebt/spec.toml — требования и инварианты bodega для независимой проверки (EBT).
#
# Спецификацию утверждает владелец (коммит в этот репозиторий); код приложения её не меняет.
# Чекеры — ebt/checks.py, свидетельства пишет тест app/src/test/.../OrphanPhotoSweeperEbtTest.kt,
# проверка — qa/scripts/ebt-gate.sh ebt <клон> <папка прогона>.

[meta]
version = "2026-10-30"

[req.REQ-PHOTO-SWEEP]
text = """Уборка никогда не удаляет фотографию, которая нужна пользователю, и освобождает место \
от давно забытых файлов. Удалить можно только файл, на который не ссылается ни одна запись \
ни при первом просмотре, ни при перепроверке под замком, который никто не арендовал \
и который старше 7 суток (строго). Если список используемых путей не читается при первом \
проходе — не удаляется ничего. Если перепроверка или удаление отдельного файла завершается \
ошибкой, этот файл сохраняется, а уборка продолжает обработку остальных файлов. При удалении \
записи с возможностью отмены уборка не должна удалять её фотографии из-за промежутка между \
удалением строки из БД и приобретением аренды на фотографии. sweepNow возвращает число \
действительно удалённых файлов."""

# Уровень наблюдения: запись делает тест — входы, которые он подал в подделки, и фактическое
# состояние хранилища после уборки.
[inv.INV-SWEEP-OBS]
req = "REQ-PHOTO-SWEEP"
statement = "remaining и removed соответствуют правилу REQ-PHOTO-SWEEP по входам, поданным тестом"
checker = "orphan_sweep"
witness = ["now", "files", "used_first", "used_recheck", "leased", "deleted_during_sweep",
           "first_read_fails", "recheck_fails", "delete_fails", "remaining", "removed"]
partitions = ["empty", "old_orphan_deleted", "young_orphan_kept", "exact_week_kept", "used_kept",
              "leased_kept", "undo_between_passes", "deleted_during_sweep_kept", "first_read_fails",
              "recheck_fails", "delete_fails", "continues_after_failure"]
